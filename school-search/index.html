<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find your district's chronic absentee rate</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Find your district's chronic absentee rate</h1>
        
        <div class="search-container">
            <input type="text" id="district-search" placeholder="Search for your school district...">
            <div id="search-results" class="search-results hidden"></div>
        </div>

        <div id="result-container" class="result-container hidden">
            <h2 id="district-name"></h2>
            <div class="chart-wrapper">
                <canvas id="absenteeChart"></canvas>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
