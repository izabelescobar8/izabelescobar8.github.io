    <!-- Main Content and Search -->
    <main class="max-w-4xl mx-auto p-4 pt-8">
        <h2 class="text-3xl font-bold mb-4 text-gray-800">Find Your Major</h2>
        <p class="text-gray-600 mb-6">Search for a major, college, or specialization to see the student headcount.</p>

        <!-- Search Input -->
        <div class="relative mb-8">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Type to search: Major Name, College, or Specialization..." 
                class="w-full px-6 py-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-red-200 focus:border-dn-red text-lg shadow-lg transition duration-150 ease-in-out"
                oninput="handleSearch(this.value.toLowerCase())"
            >
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                <!-- Search Icon (using inline SVG for simplicity) -->
                <svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- Results Display -->
        <div id="loading-indicator" class="text-center py-12 text-dn-red hidden">
            <p class="text-xl font-medium">Loading major data...</p>
        </div>
        
        <div id="no-results" class="text-center py-12 hidden">
            <p class="text-2xl font-bold text-gray-700">No Results Found</p>
            <p class="text-gray-500">Try broadening your search terms.</p>
        </div>

        <div id="results-container" class="mt-4 pb-10">
            <!-- Major Cards will be injected here by JavaScript -->
        </div>

        <div id="initial-message" class="text-center py-12">
            <p class="text-xl font-medium text-gray-500">Start typing in the search bar above to filter majors in real-time.</p>
        </div>

    </main>

    <script>
        // Global variable to store all major data
        let allMajors = [];
        const resultsContainer = document.getElementById('results-container');
        const majorCountDisplay = document.getElementById('major-count-display');
        const noResultsMessage = document.getElementById('no-results');
        const initialMessage = document.getElementById('initial-message');

        /**
         * Safely loads and parses the JSON data from the script tag.
         * The 'majors.json' data is embedded in the HTML as a script block.
         */
        function loadData() {
            try {
                const dataElement = document.getElementById('majors-data');
                if (dataElement) {
                    const dataJson = dataElement.textContent;
                    allMajors = JSON.parse(dataJson);
                    // Remove the 'Total' record for search purposes, but keep it for total count
                    const totalRecord = allMajors.find(m => m.major_name === 'Total');
                    const totalCount = totalRecord ? totalRecord.headcount : 0;
                    
                    // Filter out the 'Total' record and prepare the clean data for search
                    allMajors = allMajors.filter(m => m.major_name !== 'Total');
                    
                    majorCountDisplay.textContent = `Total Headcount: ${totalCount.toLocaleString()}`;
                    
                    // Show all results initially as the starting point
                    renderResults(allMajors);
                } else {
                    console.error("Data script tag not found.");
                }
            } catch (error) {
                console.error("Error loading or parsing major data:", error);
            }
        }

        /**
         * Filters the major data based on the search query.
         * @param {string} query - The search string, converted to lowercase.
         */
        function handleSearch(query) {
            // Hide the initial message once the user starts typing
            initialMessage.classList.add('hidden');
            
            if (query.trim() === '') {
                // If query is empty, show all results
                renderResults(allMajors);
                return;
            }

            const filteredResults = allMajors.filter(major => {
                const searchString = `${major.college} ${major.major_name} ${major.specialization}`.toLowerCase();
                return searchString.includes(query);
            });

            renderResults(filteredResults, query);
        }

        /**
         * Renders the major results to the DOM.
         * @param {Array} results - The array of major objects to display.
         * @param {string} [query=''] - The current search query (for highlighting).
         */
        function renderResults(results, query = '') {
            resultsContainer.innerHTML = '';
            
            if (results.length === 0) {
                noResultsMessage.classList.remove('hidden');
                majorCountDisplay.textContent = `Matching Majors: 0`;
                return;
            }

            noResultsMessage.classList.add('hidden');
            majorCountDisplay.textContent = `Matching Majors: ${results.length}`;


            results.forEach(major => {
                const specialization = major.specialization === '-No Specialization-' 
                    ? 'No Specific Specialization' 
                    : major.specialization;

                // Create HTML structure for a single result card
                const card = document.createElement('div');
                card.className = 'major-card bg-white p-6 rounded-xl shadow-md flex flex-col space-y-2';
                card.innerHTML = `
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">${highlight(major.college, query)}</p>
                    <h3 class="text-xl font-bold text-gray-900">${highlight(major.major_name, query)}</h3>
                    <p class="text-base text-gray-700">Specialization: <span class="font-semibold">${highlight(specialization, query)}</span></p>
                    <div class="flex items-center justify-between pt-2 border-t border-gray-100 mt-auto">
                        <span class="text-sm text-gray-500">Headcount:</span>
                        <span class="text-2xl font-extrabold text-dn-red">${major.headcount.toLocaleString()}</span>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }
        
        /**
         * Helper function to highlight the search query within the text.
         * @param {string} text - The original text content.
         * @param {string} query - The search query (must be lowercase).
         * @returns {string} HTML string with highlighted text.
         */
        function highlight(text, query) {
            if (!query) return text;
            const textLower = text.toLowerCase();
            let highlightedHtml = '';
            let lastIndex = 0;
            const queryLength = query.length;

            let matchIndex = textLower.indexOf(query, lastIndex);
            
            while (matchIndex !== -1) {
                // Add non-matching text before the match
                highlightedHtml += text.substring(lastIndex, matchIndex);

                // Add the highlighted match
                const matchedText = text.substring(matchIndex, matchIndex + queryLength);
                highlightedHtml += `<mark class="bg-yellow-300 rounded">${matchedText}</mark>`;
                
                lastIndex = matchIndex + queryLength;
                matchIndex = textLower.indexOf(query, lastIndex);
            }

            // Add remaining non-matching text
            highlightedHtml += text.substring(lastIndex);
            
            return highlightedHtml;
        }


        // Initialize the app when the window loads
        window.onload = loadData;

    </script>
